---
- name: Verify supported operating system family
  ansible.builtin.assert:
    that:
      - ansible_os_family == portfolio_expected_os_family
      - ansible_distribution == portfolio_expected_distribution
    fail_msg: >-
      Unsupported operating system. Expected Ubuntu/Debian-family host,
      got {{ ansible_distribution }} {{ ansible_distribution_version }}.
    success_msg: >-
      Supported operating system detected:
      {{ ansible_distribution }} {{ ansible_distribution_version }}.

- name: Verify supported Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_distribution_version == portfolio_supported_ubuntu_release
    fail_msg: >-
      Unsupported Ubuntu release {{ ansible_distribution_version }}.
      This deployment is certified for Ubuntu
      {{ portfolio_supported_ubuntu_release }} only.
    success_msg: >-
      Certified Ubuntu {{ portfolio_supported_ubuntu_release }} release detected.

- name: Verify systemd is the service manager
  ansible.builtin.assert:
    that:
      - ansible_service_mgr == "systemd"
    fail_msg: >-
      systemd is required for this deployment.
    success_msg: >-
      systemd service manager detected.

- name: Display deployment target contract
  ansible.builtin.debug:
    msg:
      - "Application directory: {{ portfolio_app_dir }}"
      - "Configuration directory: {{ portfolio_config_dir }}"
      - "State directory: {{ portfolio_state_dir }}"
      - "Service identity: {{ portfolio_service_user }}:{{ portfolio_service_group }}"
      - "Python baseline: {{ portfolio_python_version }}"
      - "MCP bind: {{ portfolio_bind_host }}:{{ portfolio_bind_port }}"

- name: Ensure portfolio service group exists
  ansible.builtin.group:
    name: "{{ portfolio_service_group }}"
    system: true
    state: present

- name: Ensure portfolio service account exists
  ansible.builtin.user:
    name: "{{ portfolio_service_user }}"
    group: "{{ portfolio_service_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ portfolio_app_dir }}"
    state: directory
    owner: root
    group: "{{ portfolio_service_group }}"
    mode: "0750"

- name: Ensure configuration directory exists
  ansible.builtin.file:
    path: "{{ portfolio_config_dir }}"
    state: directory
    owner: root
    group: "{{ portfolio_service_group }}"
    mode: "0750"

- name: Ensure state directory exists
  ansible.builtin.file:
    path: "{{ portfolio_state_dir }}"
    state: directory
    owner: "{{ portfolio_service_user }}"
    group: "{{ portfolio_service_group }}"
    mode: "0750"

- name: Ensure Trading 212 cache directory exists
  ansible.builtin.file:
    path: "{{ portfolio_cache_dir }}"
    state: directory
    owner: "{{ portfolio_service_user }}"
    group: "{{ portfolio_service_group }}"
    mode: "0750"

- name: Ensure runtime bootstrap packages are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Inspect installed uv version
  ansible.builtin.command:
    argv:
      - "{{ portfolio_uv_bin }}"
      - "--version"
  register: portfolio_uv_version_before
  changed_when: false
  failed_when: false

- name: Download pinned uv installer
  ansible.builtin.get_url:
    url: "https://astral.sh/uv/{{ portfolio_uv_version }}/install.sh"
    dest: "/tmp/uv-installer-{{ portfolio_uv_version }}.sh"
    owner: root
    group: root
    mode: "0755"
  when: >-
    portfolio_uv_version_before.rc != 0 or
    ('uv ' ~ portfolio_uv_version) not in portfolio_uv_version_before.stdout

- name: Install pinned unmanaged uv
  ansible.builtin.command:
    argv:
      - sh
      - "/tmp/uv-installer-{{ portfolio_uv_version }}.sh"
  environment:
    UV_UNMANAGED_INSTALL: /usr/local/bin
  when: >-
    portfolio_uv_version_before.rc != 0 or
    ('uv ' ~ portfolio_uv_version) not in portfolio_uv_version_before.stdout

- name: Verify pinned uv version
  ansible.builtin.command:
    argv:
      - "{{ portfolio_uv_bin }}"
      - "--version"
  register: portfolio_uv_version_after
  changed_when: false

- name: Assert pinned uv version
  ansible.builtin.assert:
    that:
      - "('uv ' ~ portfolio_uv_version) in portfolio_uv_version_after.stdout"
    fail_msg: >-
      uv version mismatch. Expected {{ portfolio_uv_version }},
      got {{ portfolio_uv_version_after.stdout }}.

- name: Ensure managed Python installation directory exists
  ansible.builtin.file:
    path: "{{ portfolio_python_install_dir }}"
    state: directory
    owner: root
    group: "{{ portfolio_service_group }}"
    mode: "0755"

- name: Locate pinned managed Python
  ansible.builtin.command:
    argv:
      - "{{ portfolio_uv_bin }}"
      - python
      - find
      - "{{ portfolio_python_version }}"
      - --managed-python
      - --install-dir
      - "{{ portfolio_python_install_dir }}"
  register: portfolio_python_before
  changed_when: false
  failed_when: false

- name: Install pinned managed Python
  ansible.builtin.command:
    argv:
      - "{{ portfolio_uv_bin }}"
      - python
      - install
      - "{{ portfolio_python_version }}"
      - --install-dir
      - "{{ portfolio_python_install_dir }}"
      - --no-bin
  when: portfolio_python_before.rc != 0

- name: Locate installed pinned Python
  ansible.builtin.command:
    argv:
      - "{{ portfolio_uv_bin }}"
      - python
      - find
      - "{{ portfolio_python_version }}"
      - --managed-python
      - --install-dir
      - "{{ portfolio_python_install_dir }}"
  register: portfolio_python_after
  changed_when: false

- name: Inspect deployed virtual environment
  ansible.builtin.command:
    argv:
      - "{{ portfolio_venv_dir }}/bin/python"
      - --version
  register: portfolio_venv_before
  changed_when: false
  failed_when: false

- name: Create pinned application virtual environment
  ansible.builtin.command:
    argv:
      - "{{ portfolio_uv_bin }}"
      - venv
      - --python
      - "{{ portfolio_python_after.stdout | trim }}"
      - "{{ portfolio_venv_dir }}"
  when: >-
    portfolio_venv_before.rc != 0 or
    ('Python ' ~ portfolio_python_version) not in portfolio_venv_before.stdout

- name: Copy exact production dependency lock
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../requirements.lock.txt"
    dest: "{{ portfolio_runtime_lock }}"
    owner: root
    group: "{{ portfolio_service_group }}"
    mode: "0640"

- name: Check whether deployed dependency set matches production lock
  ansible.builtin.shell: |
    set -euo pipefail
    expected="$(mktemp)"
    installed="$(mktemp)"
    trap 'rm -f "$expected" "$installed"' EXIT
    tr '[:upper:]_' '[:lower:]-' < "{{ portfolio_runtime_lock }}" | sort > "$expected"
    "{{ portfolio_uv_bin }}" pip freeze --python "{{ portfolio_venv_dir }}/bin/python" |
      tr '[:upper:]_' '[:lower:]-' |
      sort > "$installed"
    diff -u "$expected" "$installed"
  args:
    executable: /bin/bash
  register: portfolio_dependency_check
  changed_when: false
  failed_when: portfolio_dependency_check.rc not in [0, 1]

- name: Synchronize exact production dependency environment
  ansible.builtin.command:
    argv:
      - "{{ portfolio_uv_bin }}"
      - pip
      - sync
      - --python
      - "{{ portfolio_venv_dir }}/bin/python"
      - --link-mode=copy
      - "{{ portfolio_runtime_lock }}"
  when: portfolio_dependency_check.rc == 1

- name: Verify virtual environment Python version
  ansible.builtin.command:
    argv:
      - "{{ portfolio_venv_dir }}/bin/python"
      - --version
  register: portfolio_venv_python
  changed_when: false

- name: Assert virtual environment Python version
  ansible.builtin.assert:
    that:
      - "('Python ' ~ portfolio_python_version) in portfolio_venv_python.stdout"
    fail_msg: >-
      Application virtual environment has the wrong Python version:
      {{ portfolio_venv_python.stdout }}.

- name: Verify exact deployed dependency set
  ansible.builtin.shell: |
    set -euo pipefail
    expected="$(mktemp)"
    installed="$(mktemp)"
    trap 'rm -f "$expected" "$installed"' EXIT
    tr '[:upper:]_' '[:lower:]-' < "{{ portfolio_runtime_lock }}" | sort > "$expected"
    "{{ portfolio_uv_bin }}" pip freeze --python "{{ portfolio_venv_dir }}/bin/python" \
      | tr '[:upper:]_' '[:lower:]-' \
      | sort > "$installed"
    diff -u "$expected" "$installed"
  args:
    executable: /bin/bash
  changed_when: false

- name: Deploy reviewed application files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../src/{{ item }}"
    dest: "{{ portfolio_app_dir }}/{{ item }}"
    owner: root
    group: "{{ portfolio_service_group }}"
    mode: "0640"
  loop: "{{ portfolio_application_files }}"

- name: Verify deployed application files byte-for-byte
  ansible.builtin.command:
    argv:
      - cmp
      - -s
      - "{{ playbook_dir }}/../../src/{{ item }}"
      - "{{ portfolio_app_dir }}/{{ item }}"
  loop: "{{ portfolio_application_files }}"
  changed_when: false

- name: Syntax-check deployed application modules without writing bytecode
  ansible.builtin.command:
    argv:
      - "{{ portfolio_venv_dir }}/bin/python"
      - -c
      - >-
        from pathlib import Path;
        files = [
          "{{ portfolio_app_dir }}/server.py",
          "{{ portfolio_app_dir }}/trading212.py",
          "{{ portfolio_app_dir }}/portfolio_accounting.py",
          "{{ portfolio_app_dir }}/portfolio_snapshot_service.py"
        ];
        [compile(Path(path).read_text(encoding="utf-8"), path, "exec") for path in files]
  changed_when: false

- name: Import credential-independent deployed modules
  ansible.builtin.command:
    argv:
      - "{{ portfolio_venv_dir }}/bin/python"
      - -c
      - >-
        import sys;
        sys.path.insert(0, "{{ portfolio_app_dir }}");
        import portfolio_accounting;
        import portfolio_snapshot_service
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  changed_when: false

- name: Deploy canonical systemd unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../portfolio-mcp.service"
    dest: "{{ portfolio_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: portfolio_service_unit_copy

- name: Verify deployed systemd unit byte-for-byte
  ansible.builtin.command:
    argv:
      - cmp
      - -s
      - "{{ playbook_dir }}/../portfolio-mcp.service"
      - "{{ portfolio_service_unit }}"
  changed_when: false

- name: Reload systemd after unit change
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: portfolio_service_unit_copy.changed
