portfolio_service_user: portfolio
portfolio_service_group: portfolio

portfolio_app_dir: /opt/portfolio-hub
portfolio_config_dir: /etc/portfolio-hub
portfolio_state_dir: /var/lib/portfolio-hub
portfolio_cache_dir: /var/lib/portfolio-hub/cache/trading212

portfolio_python_version: "3.14.4"

portfolio_service_name: portfolio-mcp
portfolio_service_unit: /etc/systemd/system/portfolio-mcp.service

portfolio_bind_host: "127.0.0.1"
portfolio_bind_port: 8000

portfolio_expected_os_family: Debian
portfolio_expected_distribution: Ubuntu
portfolio_supported_ubuntu_release: "26.04"

portfolio_uv_version: "0.12.9"
portfolio_uv_bin: /usr/local/bin/uv

portfolio_python_install_dir: /opt/portfolio-hub/python
portfolio_venv_dir: /opt/portfolio-hub/venv
portfolio_runtime_lock: /opt/portfolio-hub/requirements.lock.txt

portfolio_application_files:
  - server.py
  - trading212.py
  - portfolio_accounting.py
  - portfolio_snapshot_service.py
  - requirements.txt

portfolio_api_key_file: /etc/portfolio-hub/trading212_api_key
portfolio_api_secret_file: /etc/portfolio-hub/trading212_api_secret
portfolio_secret_owner: root
portfolio_secret_group: portfolio
portfolio_secret_mode: "0640"

portfolio_required_secret_files:
  - "{{ portfolio_api_key_file }}"
  - "{{ portfolio_api_secret_file }}"

portfolio_recovery_auth_dir: ""

portfolio_recovery_auth_files:
  - source_name: trading212_api_key
    destination: "{{ portfolio_api_key_file }}"
  - source_name: trading212_api_secret
    destination: "{{ portfolio_api_secret_file }}"

# Phase B: verified production network contract
portfolio_tailscale_baseline_version: "1.102.2"
portfolio_tailscale_repo_codename: resolute
portfolio_tailscale_keyring_url: "https://pkgs.tailscale.com/stable/ubuntu/resolute.noarmor.gpg"
portfolio_tailscale_keyring_sha256: "3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39"
portfolio_tailscale_keyring_path: /usr/share/keyrings/tailscale-archive-keyring.gpg
portfolio_tailscale_repo_file: /etc/apt/sources.list.d/tailscale.list
portfolio_tailscale_repo_line: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu resolute main"

portfolio_tailscale_expected_hostname: portfolio-hub
portfolio_tailscale_expected_dns_name: portfolio-hub.tail894a11.ts.net.
portfolio_tailscale_interface: tailscale0

portfolio_funnel_public_url: "https://portfolio-hub.tail894a11.ts.net"
portfolio_funnel_target: "http://127.0.0.1:8000"

portfolio_ufw_baseline_version: "0.36.2-9build1"
portfolio_ssh_port: 22
portfolio_ufw_expected_ssh_rule: "ufw allow in on tailscale0 to any port 22 proto tcp"
